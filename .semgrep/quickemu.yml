rules:
  - id: shell-eval
    pattern: eval $X
    message: eval is forbidden — refactor to a function call or array.
    severity: ERROR
    languages: [bash]
  - id: shell-uncontrolled-source
    patterns:
      - pattern: source $F
      - metavariable-regex:
          metavariable: $F
          regex: .*\$\{?(VM|USER|HOME).*|\$1.*
    message: sourcing a variable/user-controlled path.
    severity: WARNING
    languages: [bash]
  - id: shell-dangerous-rm
    patterns:
      - pattern: rm -rf $P
      - metavariable-regex:
          metavariable: $P
          regex: .*\$\{?(HOME|PWD|~|/)\}?.*
    message: rm -rf on a root-like/variable path — use safe-delete checks.
    severity: WARNING
    languages: [bash]
  - id: shell-mktemp-unsafe
    pattern: |
      $T=/tmp/$X
    message: use mktemp -d instead of a predictable /tmp path.
    severity: WARNING
    languages: [bash]
