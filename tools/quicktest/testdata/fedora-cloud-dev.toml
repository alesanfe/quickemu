# Fedora Cloud Base image (qcow2, cloud-init preinstalled). dnf
# provisioning + systemd services — third package-manager family in
# the provider matrix (apt/apk/dnf). Release 43's kernel hangs under
# pure-TCG hosts (systemd PID1 crashes mid-boot — QEMU 8.2/MTTCG vs
# 6.17); use 42 for software emulation, 43+ on KVM.
[profile]
name = "fedora-cloud-dev"
description = "Fedora 42 cloud image provisioned into a dev VM"

[system]
os = "fedora-cloud"
release = "42"
arch = "amd64"

[machine]
cpus = 4
ram = "4G"
disk_size = "32G"

[identity]
hostname = "fedora-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
lang = "es_ES.UTF-8"
keyboard = "es"
timezone = "Europe/Madrid"

[automation]
provider = "nocloud-image"
ssh_timeout_min = 45

[provision]
packages = ["git", "curl", "qemu-guest-agent"]
services = ["qemu-guest-agent"]

  [[provision.commands]]
  name = "os-release"
  run = "cat /etc/os-release | head -3"
  as = "dev"

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "fedora-dev"

[[verify]]
name = "git"
run = "git --version"
expect = "git version"

[[verify]]
name = "qga-installed"
run = "rpm -q qemu-guest-agent"

[[verify]]
name = "network-dns"
run = "getent hosts fedoraproject.org"

[finalize]
shutdown = true
snapshot = "prepared"
