# Debian genericcloud image (qcow2, cloud-init preinstalled). Apt
# provisioning + systemd services; exercises the same pipeline as the
# Ubuntu profile with a different distro userspace.
[profile]
name = "debian-cloud-dev"
description = "Debian 12 cloud image provisioned into a dev VM"

[system]
os = "debian-cloud"
release = "12"
arch = "amd64"

[machine]
cpus = 4
ram = "4G"
disk_size = "32G"

[identity]
hostname = "debian-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
lang = "es_ES.UTF-8"
keyboard = "es"
timezone = "Europe/Madrid"

[automation]
provider = "nocloud-image"
ssh_timeout_min = 30

[provision]
packages = ["git", "curl", "qemu-guest-agent"]
services = ["qemu-guest-agent"]

  [[provision.commands]]
  name = "os-release"
  run = "cat /etc/os-release | head -3"
  as = "dev"

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "debian-dev"

[[verify]]
name = "git"
run = "git --version"
expect = "git version"

[[verify]]
name = "qga-installed"
run = "dpkg -s qemu-guest-agent"
expect = "Status: install ok installed"

[[verify]]
name = "network-dns"
run = "getent hosts deb.debian.org"

[finalize]
shutdown = true
snapshot = "prepared"
