# Ultramarine via anaconda kickstart — the catalog resolver prefers
# the -anaconda ISO variant (readymade live images are skipped), so
# inst.ks boot args apply exactly like the RHEL family.
[profile]
name = "ultramarine-dev"
description = "Ultramarine unattended install provisioned into a dev VM"

[system]
os = "ultramarine"
release = "latest"
arch = "amd64"

[machine]
cpus = 2
ram = "4G"
disk_size = "25G"

[identity]
hostname = "um-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
timezone = "Europe/Madrid"

[automation]
provider = "anaconda-kickstart"
install_timeout_min = 90
ssh_timeout_min = 30

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "um-dev"

[[verify]]
name = "os-release"
run = "grep -o 'Ultramarine' /etc/os-release | head -1"
expect = "Ultramarine"

[finalize]
shutdown = true
snapshot = "prepared"
