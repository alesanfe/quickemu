# The vertical demo — Ubuntu Server 24.04 LTS installed unattended
# (subiquity autoinstall via NoCloud seed), provisioned over SSH and
# verified. Ends powered off with a 'prepared' snapshot.
[profile]
name = "ubuntu-dev"
description = "Ubuntu Server de desarrollo — instala, provisiona y verifica"

[system]
os = "ubuntu-server"
release = "24.04"
arch = "amd64"

[machine]
cpus = 4
ram = "4G"
disk_size = "32G"

[identity]
hostname = "ubuntu-dev"
username = "dev"
password = ""                # empty → random; key auth is the real path
allow_pw_auth = false

[locale]
lang = "es_ES.UTF-8"
keyboard = "es"
timezone = "Europe/Madrid"

[automation]
provider = "auto"            # → ubuntu-autoinstall
install_timeout_min = 180   # TCG emulation makes subiquity ~4-6x slower
ssh_timeout_min = 10

[provision]
packages = ["git", "curl", "qemu-guest-agent"]
services = ["qemu-guest-agent"]

  [[provision.commands]]
  name = "os-release"
  run = "cat /etc/os-release | head -3"
  as = "dev"

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "ubuntu-dev"

[[verify]]
name = "git"
run = "git --version"
expect = "git version"

[[verify]]
name = "qga-installed"
run = "dpkg -s qemu-guest-agent"
expect = "Status: install ok installed"

[[verify]]
name = "network-dns"
run = "getent hosts archive.ubuntu.com"

[finalize]
shutdown = true
snapshot = "prepared"
