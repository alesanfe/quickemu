# Ubuntu Desktop ISO via the bootstrap installer — subiquity-driven
# autoinstall like the server, but completion is a serial marker (the
# desktop schema has no shutdown directive; it reboots, so the run
# kills the guest when curtin reports finished).
[profile]
name = "ubuntu-desktop-dev"
description = "Ubuntu Desktop 24.04 unattended install provisioned into a dev VM"

[system]
os = "ubuntu"
release = "24.04"
arch = "amd64"

[machine]
cpus = 4
ram = "8G"
disk_size = "48G"

[identity]
hostname = "ubuntu-desktop-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
lang = "es_ES.UTF-8"
keyboard = "es"
timezone = "Europe/Madrid"

[automation]
provider = "ubuntu-desktop-autoinstall"
install_timeout_min = 90
ssh_timeout_min = 30

[provision]
packages = ["git", "curl", "qemu-guest-agent"]
services = ["qemu-guest-agent"]

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "ubuntu-desktop-dev"

[[verify]]
name = "git"
run = "git --version"
expect = "git version"

[[verify]]
name = "network-dns"
run = "getent hosts archive.ubuntu.com"

[finalize]
shutdown = true
snapshot = "prepared"
