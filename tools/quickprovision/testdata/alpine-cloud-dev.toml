# Alpine cloud image (qcow2, cloud-init via NoCloud). Smallest and
# fastest of the cloud-image set — good pipeline smoke test when TCG
# makes bigger guests painful. OpenRC service manager, apk packages.
[profile]
name = "alpine-cloud-dev"
description = "Alpine cloud image provisioned into a dev VM"

[system]
os = "alpine-cloud"
release = "v3.22"
arch = "amd64"

[machine]
cpus = 2
ram = "1G"
disk_size = "8G"

[identity]
hostname = "alpine-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
lang = "en_US.UTF-8"
timezone = "Europe/Madrid"

[automation]
provider = "nocloud-image"
ssh_timeout_min = 15

[provision]
packages = ["git", "curl", "qemu-guest-agent"]
services = ["qemu-guest-agent"]

  [[provision.commands]]
  name = "os-release"
  run = "cat /etc/os-release | head -3"
  as = "dev"

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "alpine-dev"

[[verify]]
name = "git"
run = "git --version"
expect = "git version"

[[verify]]
name = "qga-installed"
run = "apk info -e qemu-guest-agent"

[[verify]]
name = "network-dns"
run = "nslookup dl-cdn.alpinelinux.org"

[finalize]
shutdown = true
snapshot = "prepared"
