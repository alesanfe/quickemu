# Void Linux via serial xbps install — live ISO login root/voidlinux,
# then the fetch-and-run script: sfdisk + xbps-install -r /mnt
# base-system from the void mirror + runit service links + grub.
[profile]
name = "void-dev"
description = "Void Linux unattended install provisioned into a dev VM"

[system]
os = "void"
release = "latest"
edition = "glibc"
arch = "amd64"

[machine]
cpus = 2
ram = "4G"
disk_size = "20G"

[identity]
hostname = "void-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
timezone = "Europe/Madrid"

[automation]
provider = "void-xbps"
install_timeout_min = 90
ssh_timeout_min = 30

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "void-dev"

[[verify]]
name = "os-release"
run = "grep -o 'Void' /etc/os-release | head -1"
expect = "Void"

[finalize]
shutdown = true
snapshot = "prepared"
