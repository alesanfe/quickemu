# Vertical demo fast path — Ubuntu 24.04 cloud image (pre-installed
# qcow2). cloud-init applies identity+keys from the NoCloud seed; the
# SSH provision + verify + seal stages exercise the real Ubuntu
# userspace. This is the pipeline proof when no KVM is available —
# the autoinstall profile (ubuntu-dev.toml) covers ISO installs.
[profile]
name = "ubuntu-cloud-dev"
description = "Ubuntu 24.04 cloud image provisioned into a dev VM"

[system]
os = "ubuntu"
release = "24.04"
arch = "amd64"

[machine]
cpus = 4
ram = "4G"
disk_size = "32G"

[identity]
hostname = "ubuntu-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
lang = "es_ES.UTF-8"
keyboard = "es"
timezone = "Europe/Madrid"

[automation]
provider = "nocloud-image"
ssh_timeout_min = 30

[provision]
packages = ["git", "curl", "qemu-guest-agent"]
services = ["qemu-guest-agent"]

  [[provision.commands]]
  name = "os-release"
  run = "cat /etc/os-release | head -3"
  as = "dev"

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "ubuntu-dev"

[[verify]]
name = "git"
run = "git --version"
expect = "git version"

[[verify]]
name = "qga-installed"
run = "dpkg -s qemu-guest-agent"
expect = "Status: install ok installed"

[[verify]]
name = "network-dns"
run = "getent hosts archive.ubuntu.com"

[finalize]
shutdown = true
snapshot = "prepared"
