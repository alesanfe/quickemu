# Artix via serial basestrap — archiso-style root console (login
# root/artix), then the script basestraps base+openrc from artix
# repos, fstabgen, artix-chroot for user/grub/rc-update services.
[profile]
name = "artix-dev"
description = "Artix Linux unattended install provisioned into a dev VM"

[system]
os = "artixlinux"
release = "latest"
edition = "base-openrc"
arch = "amd64"

[machine]
cpus = 2
ram = "4G"
disk_size = "20G"

[identity]
hostname = "artix-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
lang = "es_ES.UTF-8"
timezone = "Europe/Madrid"

[automation]
provider = "artix-basestrap"
install_timeout_min = 90
ssh_timeout_min = 30

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "artix-dev"

[[verify]]
name = "os-release"
run = "grep -o 'Artix' /etc/os-release | head -1"
expect = "Artix"

[finalize]
shutdown = true
snapshot = "prepared"
