# Flatcar via serial flatcar-install — the ISO's live env autologins
# `core`, the run types fetch+run: download ignition.json over slirp,
# `sudo flatcar-install -d /dev/vda -i ign.json`, reboot marker ends
# the install phase.
[profile]
name = "flatcar-dev"
description = "Flatcar Linux unattended install provisioned into a dev VM"

[system]
os = "flatcar"
release = "latest"
arch = "amd64"

[machine]
cpus = 2
ram = "4G"
disk_size = "16G"

[identity]
hostname = "flatcar-dev"
username = "dev"
password = ""
allow_pw_auth = false

[locale]
timezone = "Europe/Madrid"

[automation]
provider = "flatcar-ignition"
install_timeout_min = 60
ssh_timeout_min = 30

[[verify]]
name = "ssh-alive"
run = "true"

[[verify]]
name = "hostname"
run = "hostname"
expect = "flatcar-dev"

[[verify]]
name = "os-release"
run = "grep -o 'Flatcar' /etc/os-release | head -1"
expect = "Flatcar"

[finalize]
shutdown = true
snapshot = "prepared"
