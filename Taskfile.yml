version: '3'

tasks:
  build:
    desc: Build all Go tool binaries (entries land in bin/)
    cmds:
      - go run ./tools/dev build

  lint:
    desc: go vet + tests + coverage + build for every module
    cmds:
      - go run ./tools/dev check

  quality:
    desc: Single root gate — gofmt + vet + tests(-race) + build + coverage (fast)
    cmds:
      - go run ./tools/dev quality

  quality-full:
    desc: Full gate — quality + qespec suite (real QEMU)
    cmds:
      - go run ./tools/dev quality --full

  test:
    desc: Go spec suite (tools/qespec)
    cmds:
      - go run ./tools/dev specs

  check:
    desc: Validate an OS download URL
    cmds:
      - ./bin/quickget --check {{.CLI_ARGS}}

  list:
    desc: List supported OSes
    cmds:
      - ./bin/quickget --list
