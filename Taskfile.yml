version: '3'

tasks:
  lint:
    desc: ShellCheck + bash -n on all scripts
    cmds:
      - shellcheck bin/quickemu bin/quickget bin/quickreport $(find lib -name "*.sh") || true
      - bash -n bin/quickemu bin/quickget bin/quickreport
      - for f in lib/*/*.sh; do bash -n "$f"; done

  test:
    desc: Run the unit/contract test suite
    cmds:
      - shellspec

  check:
    desc: Validate an OS download URL
    cmds:
      - ./bin/quickget --check {{.CLI_ARGS}}
