version: '3'

tasks:
  build:
    desc: Build all Go tool binaries (required before bin/ works)
    cmds:
      - bash tools/build-go.sh

  lint:
    desc: ShellCheck on wrappers + dev scripts, go vet on all modules
    cmds:
      - shellcheck -S warning bin/quickemu bin/quickget bin/quickgetc bin/quickreport tools/*.sh
      - bash -n bin/quickemu bin/quickget bin/quickgetc bin/quickreport
      - bash tools/go-check.sh

  test:
    desc: Per-spec ShellSpec suite (isolated process groups, timeouts)
    cmds:
      - bash tools/run-specs.sh 240 spec

  check:
    desc: Validate an OS download URL
    cmds:
      - ./bin/quickget --check {{.CLI_ARGS}}
