name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly

permissions: read-all

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@f2fbf28b4b58b513b0fa1e61c4064b2f8af4db49 # v2.3.7

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
      - uses: google/osv-scanner-action@3f77f2ee2ba5b04f4f7a3d4d2f5c8d3a1b2f1d0a # v2.2.0

  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddcf8cde # v2.4.0
        with:
          results_file: results.sarif
          publish_results: false
