name: Stale issues
on:
  schedule:
    - cron: '0 4 * * 0'  # weekly Sunday 04:00 UTC
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@28abac1ddcd36e6ad1f9c1e0f2c85d9a5a7be1bc  # v10
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue has been inactive for 60 days. It will close in 14 days unless there is activity.'
          stale-pr-message: 'This PR has been inactive for 60 days. It will close in 14 days unless there is activity.'
          exempt-issue-labels: 'pinned,security,upstream-blocked'
