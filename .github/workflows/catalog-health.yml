name: Catalog health
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - run: go run ./tools/dev build
      - run: go run ./tools/dev check-catalog
