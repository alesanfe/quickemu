name: Coverage (kcov behavioral)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install kcov + deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends kcov jq
      - name: Behavioral coverage via kcov
        run: bash tools/coverage-kcov.sh spec/unit
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kcov-report
          path: /tmp/kcov-*
