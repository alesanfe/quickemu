name: Supply-chain hardening
on: [push, pull_request]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          wget -q https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz
          tar -xzf actionlint_*_linux_amd64.tar.gz actionlint
          ./actionlint -oneline
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: zizmorcore/zizmor-action@v0.4.0
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --skip-git
            -r .
