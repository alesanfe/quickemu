name: shellspec-suite

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-utils qemu-system-x86 socat jq shellcheck shfmt \
            netcat-openbsd psmisc
      - name: Build Go tools
        uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - name: Compile tool binaries
        run: bash tools/build-go.sh
      - name: ShellCheck
        run: shellcheck -S warning bin/quickemu bin/quickget bin/quickgetc bin/quickreport tools/*.sh
      - name: Run spec suite (per-spec timeouts, isolated process groups)
        run: bash tools/run-specs.sh 240 spec
      - name: Assert no residual processes
        if: always()
        run: |
          pgrep -af 'socat|qemu-system|shellspec' && exit 1 || true
      - name: Upload failing spec logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: spec-artifacts
          path: .spec-artifacts/
          retention-days: 14
  specs-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build Go tools
        uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - name: Compile tool binaries
        run: bash tools/build-go.sh
      - name: run portable specs on macOS
        run: |
          ./shellspec-0.28.1/shellspec spec/smoke/ spec/contract/
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build Go tools
        uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - name: Go test coverage report
        run: |
          for d in tools/*/; do
            [ -f "$d/go.mod" ] || continue
            (cd "$d" && go test -cover ./...)
          done
