name: Test build quickemu 🚧

on:
  pull_request:
    branches:
      - master
    paths:
      - 'bin/**'
      - 'tools/**'
      - 'packaging/**'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches:
      - master
    paths:
      - 'bin/**'
      - 'tools/**'
      - 'packaging/**'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

# TODO: arm64 runner
# https://github.blog/changelog/2024-06-03-actions-arm-based-linux-and-windows-runners-are-now-in-public-beta/

permissions:
  contents: read
jobs:
  test-deb-build:
    runs-on: ubuntu-22.04
    steps:
    - name: "Checkout 🥡"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - name: "Build & Test .deb 🍥"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo apt-get -y update
        sudo apt-get -y install debhelper devscripts golang-go
        cp -a packaging/debian debian
        REL_VER=$(grep 'QEVersion = "' tools/qelib/qelib.go | cut -d'"' -f2)
        rm debian/changelog
        dch --package quickemu --newversion="${REL_VER}-1" --distribution=unstable "New upstream release." --create
        dpkg-buildpackage --build=binary --no-check-builddeps --compression=gzip
        sudo apt-get -y install ../quickemu_"${REL_VER}-1_"*.deb
        quickemu --help
        quickget --help

  test-nix-build:
    runs-on: ubuntu-22.04
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - name: "Checkout 🥡"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: "Install Nix ❄️"
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
      - name: "Enable Magic Nix Cache 🪄"
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # v15
      - name: "Build & Test .nix ❄️"
        run: |
          nix build .#quickemu
          tree ./result
          ./result/bin/quickemu --help
          ./result/bin/quickget --help
          ./result/bin/quickreport
          # Text a VM if the Nix Installer successfully enabled KVM
          if [ "$DETERMINATE_NIX_KVM" -eq 1 ]; then
            ./result/bin/quickget alpine v3.20
            ./result/bin/quickemu --vm alpine-v3.20.conf --display none
            sleep 5
            if pgrep -F ./alpine-v3.20/alpine-v3.20.pid; then
              echo "Test VM is running"
            else
              echo "Test VM is not running"
              exit 1
            fi
            # Test a few more quickemu commands to clean up
            ./result/bin/quickemu --vm alpine-v3.20.conf --kill
            ./result/bin/quickemu --vm alpine-v3.20.conf --delete-disk
            ./result/bin/quickemu --vm alpine-v3.20.conf --delete-vm
          fi
