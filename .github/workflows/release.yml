name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c8c92ee2c4c71f70f4824f1b2b3c4d5e6f7a8b  # v7
      - name: Generate SBOM
        run: bash scripts/gen-sbom.sh "${GITHUB_REF_NAME}" > sbom.json
      - name: Build tarball + checksums
        run: |
          tar -czf "quickemu-${GITHUB_REF_NAME}.tar.gz" bin lib libexec schemas spec docs AGENTS.md
          sha256sum "quickemu-${GITHUB_REF_NAME}.tar.gz" sbom.json > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@72f2c99fcb4768fed3efc4a12ce4c0d4ae7d90d3  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            quickemu-${{ github.ref_name }}.tar.gz
            sbom.json
            SHA256SUMS
          generate_release_notes: true
