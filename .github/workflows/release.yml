name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: tools/release-notes > RELEASE_NOTES.md || true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
