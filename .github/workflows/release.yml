name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Generate SBOM
        run: bash scripts/gen-sbom.sh "${GITHUB_REF_NAME}" > sbom.json
      - name: Build tarball + checksums
        run: |
          tar -czf "quickemu-${GITHUB_REF_NAME}.tar.gz" bin lib libexec schemas spec docs AGENTS.md
          sha256sum "quickemu-${GITHUB_REF_NAME}.tar.gz" sbom.json > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            quickemu-${{ github.ref_name }}.tar.gz
            sbom.json
            SHA256SUMS
          generate_release_notes: true
