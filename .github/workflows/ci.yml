name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install qemu-utils qemu-system-x86
      - name: Install shellspec
        run: |
          curl -sSfL https://github.com/shellspec/shellspec/archive/refs/tags/0.28.1.tar.gz | tar -xz
          chmod +x shellspec-0.28.1/shellspec
          echo "$PWD/shellspec-0.28.1" >> "$GITHUB_PATH"
      - name: Run unit + contract tests
        run: shellspec
      - name: Record quality metrics
        if: always()
        run: go run ./tools/dev metrics record ci_run=true
      - name: Metrics trend gate (CMMI-4)
        if: always()
        run: go run ./tools/dev metrics trend
      - name: Upload metrics history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: quality-history
          path: docs/quality/history.jsonl

  bash-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install dependencies
        run: sudo apt-get -y update && sudo apt-get -y install qemu-utils jq
      - name: Bash entrypoints smoke test
        run: |
          bin/quickemu --help >/dev/null
          bin/quickemu --version
          bin/quickget --list | tail -5
          bin/quickget --version 2>/dev/null || true
          bash -n bin/quickemu bin/quickget bin/quickgetc bin/quickreport
          echo "bash baseline OK"

  e2e:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install qemu-utils qemu-system-x86 socat
      - name: Install shellspec
        run: |
          curl -sSfL https://github.com/shellspec/shellspec/archive/refs/tags/0.28.1.tar.gz | tar -xz
          chmod +x shellspec-0.28.1/shellspec
          echo "$PWD/shellspec-0.28.1" >> "$GITHUB_PATH"
      - name: Run e2e (TCG, real QEMU)
        run: shellspec spec/e2e/
        timeout-minutes: 15
