name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install qemu-utils qemu-system-x86 socat
      - name: Build Go binaries
        run: go run ./tools/dev build
      - name: Go spec suite (contract, functional, e2e w/ real QEMU)
        run: go run ./tools/dev specs
      - name: Assert no residual processes
        if: always()
        run: |
          pgrep -af 'socat|qemu-system' && exit 1 || true
      - name: Record quality metrics
        if: always()
        run: go run ./tools/dev metrics record ci_run=true
      - name: Metrics trend gate (CMMI-4)
        if: always()
        run: go run ./tools/dev metrics trend
      - name: Upload metrics history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: quality-history
          path: docs/quality/history.jsonl

  entrypoint-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - name: Build + smoke test Go entrypoints
        run: |
          go run ./tools/dev build
          bin/quickemu --help >/dev/null
          bin/quickemu --version
          bin/quickget --list | tail -5
          bin/quickget --version 2>/dev/null || true
          file bin/quickemu bin/quickget | grep -q ELF
          echo "entrypoint smoke OK"

  specs-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@4b73464bb391e405a14327b7d613ca9d90898b08  # v5
        with:
          go-version: '1.25'
      - name: Build Go binaries
        run: go run ./tools/dev build
      - name: Portable spec subset (QEMU-dependent tests self-skip)
        run: go test ./tools/qespec/ -run 'Smoke|Contract|Schema' -v
