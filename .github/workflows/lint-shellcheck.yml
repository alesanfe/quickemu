name: "Lint Shellcheck 🐚"

on:
  pull_request:
    branches: '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install ShellCheck
        run: sudo apt-get -y update && sudo apt-get -y install shellcheck
      - name: Run ShellCheck
        run: |
          mapfile -t scripts < <(find lib -name '*.sh')
          shellcheck -S warning --format=gcc bin/quickemu bin/quickget bin/quickgetc bin/quickreport "${scripts[@]}"
