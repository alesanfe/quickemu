name: "Lint Shellcheck 🐚"

on:
  pull_request:
    branches: '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck -S warning --format=gcc bin/quickemu bin/quickget bin/quickgetc bin/quickreport $(find lib -name '*.sh')
